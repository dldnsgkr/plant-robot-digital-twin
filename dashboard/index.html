<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Plant Robot Digital Twin 관제</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
<style>
  :root { --bg:#12161c; --panel:#1b2230; --line:#2c3648; --tx:#dbe4f0;
          --dim:#8494ab; --ok:#3fce7c; --warn:#f5b942; --bad:#f2545b; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx);
         font:14px/1.5 "Pretendard","Segoe UI",sans-serif; padding:16px; }
  h1 { font-size:18px; margin-bottom:4px; }
  #conn { font-size:12px; color:var(--dim); margin-bottom:12px; }
  #conn.on { color:var(--ok); }
  .grid { display:grid; grid-template-columns: 640px 1fr; gap:14px; }
  .panel { background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:12px; }
  .panel h2 { font-size:13px; color:var(--dim); text-transform:uppercase;
              letter-spacing:.08em; margin-bottom:8px; }
  canvas { background:#0d1117; border-radius:6px; width:100%; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tile { background:#141a26; border:1px solid var(--line); border-radius:8px;
          padding:10px 12px; }
  .tile .k { font-size:11px; color:var(--dim); }
  .tile .v { font-size:22px; font-weight:700; margin-top:2px; }
  .tile .v small { font-size:12px; color:var(--dim); font-weight:400; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px;
           font-size:11px; font-weight:700; }
  .b-ok { background:#12321f; color:var(--ok); }
  .b-warn { background:#3a2d10; color:var(--warn); }
  .b-bad { background:#3a1214; color:var(--bad); }
  #batbar { height:10px; background:#0d1117; border-radius:5px; margin-top:6px;
            overflow:hidden; }
  #batfill { height:100%; background:var(--ok); width:100%;
             transition:width .5s; }
  #events { list-style:none; font-size:12px; max-height:180px; overflow-y:auto; }
  #events li { padding:3px 0; border-bottom:1px dashed var(--line);
               color:var(--dim); }
  #events li:first-child { color:var(--tx); }
  .col { display:flex; flex-direction:column; gap:14px; }
</style>
</head>
<body>
<h1>🐕 플랜트 4족 로봇 Digital Twin 관제</h1>
<div id="conn">rosbridge 연결 중… (ws://localhost:9090)</div>

<div class="grid">
  <div class="panel">
    <h2>Virtual Plant — 로봇 위치 · 가스 농도장</h2>
    <canvas id="map" width="1280" height="360"></canvas>
  </div>
  <div class="col">
    <div class="panel">
      <h2>미션</h2>
      <div class="tiles">
        <div class="tile"><div class="k">상태</div>
          <div class="v" id="mstate">—</div></div>
        <div class="tile"><div class="k">배터리</div>
          <div class="v" id="bat">— %</div><div id="batbar"><div id="batfill"></div></div></div>
      </div>
    </div>
    <div class="panel">
      <h2>점검 데이터 (Inspection)</h2>
      <div class="tiles">
        <div class="tile"><div class="k">압력계 판독</div>
          <div class="v" id="gauge">— <small>bar</small></div></div>
        <div class="tile"><div class="k">실제값 (truth)</div>
          <div class="v" id="truth">— <small>bar</small></div></div>
        <div class="tile"><div class="k">최고 온도</div>
          <div class="v" id="temp">—</div></div>
        <div class="tile"><div class="k">로봇 위치 가스 농도</div>
          <div class="v" id="gasc">— <small>ppm</small></div></div>
      </div>
    </div>
    <div class="panel">
      <h2>이벤트</h2>
      <ul id="events"></ul>
    </div>
  </div>
</div>

<script>
// ---- 월드 기하 (plant_world.sdf와 동일) ----
const WORLD = { x0:-13.5, x1:59, y0:-10, y1:10 };
const OBS = [[8,2,.45],[-9,6,1.35],[5,5,.55],[-6,4,.8],[3,-5,.8],
             [-3,-3,1.4],[-9,-6,2.0],[10.6,-7,1.8]];
const cv = document.getElementById('map'), cx2 = cv.getContext('2d');
// 등방 스케일 (지도 왜곡 방지)
const S = Math.min(cv.width / (WORLD.x1 - WORLD.x0),
                   cv.height / (WORLD.y1 - WORLD.y0));
const SX = S, SY = S;
const px = x => (x - WORLD.x0) * S;
const py = y => cv.height - (y - WORLD.y0) * S;

let robot = null, gasGrid = null, trail = [];
let robotB = null, trailB = [];   // 보너스②: 2호기

function draw() {
  cx2.clearRect(0, 0, cv.width, cv.height);
  // 가스 농도장 (OccupancyGrid 50x36 @0.5m, origin -12.5,-9)
  if (gasGrid) {
    const {w, h, res, ox, oy, data} = gasGrid;
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      const v = data[j * w + i];
      if (v < 3) continue;
      cx2.fillStyle = `rgba(255,${Math.max(0,180-v*2)},40,${Math.min(.55,v/90)})`;
      cx2.fillRect(px(ox + i * res), py(oy + (j + 1) * res),
                   res * SX + 1, res * SY + 1);
    }
  }
  // 건물 외곽
  cx2.strokeStyle = '#3b4a63'; cx2.lineWidth = 2;
  cx2.strokeRect(px(-12.5), py(9), 25 * SX, 18 * SY);          // 공장
  cx2.strokeRect(px(12.5), py(1.75), 45 * SX, 3.5 * SY);       // 복도
  // 장애물
  cx2.fillStyle = '#2c3648';
  for (const [x, y, r] of OBS) {
    cx2.beginPath(); cx2.arc(px(x), py(y), r * SX, 0, 7); cx2.fill();
  }
  // 주요 지점
  const mark = (x, y, c, t) => { cx2.fillStyle = c;
    cx2.beginPath(); cx2.arc(px(x), py(y), 5, 0, 7); cx2.fill();
    cx2.font = '11px sans-serif'; cx2.fillText(t, px(x) + 8, py(y) + 4); };
  mark(11, 7.5, '#3fce7c', '충전소');
  mark(38, 1.62, '#7aa2ff', '압력계');
  mark(-9, 6, '#f5b942', '가스탱크');
  mark(-9, -6, '#9a86e8', '공장기계');
  // 이동 궤적
  if (trail.length > 1) {
    cx2.strokeStyle = 'rgba(122,162,255,.5)'; cx2.lineWidth = 1.5;
    cx2.beginPath(); cx2.moveTo(px(trail[0][0]), py(trail[0][1]));
    for (const [x, y] of trail) cx2.lineTo(px(x), py(y));
    cx2.stroke();
  }
  // 2호기 궤적 (주황)
  if (trailB.length > 1) {
    cx2.strokeStyle = 'rgba(245,185,66,.5)'; cx2.lineWidth = 1.5;
    cx2.beginPath(); cx2.moveTo(px(trailB[0][0]), py(trailB[0][1]));
    for (const [x, y] of trailB) cx2.lineTo(px(x), py(y));
    cx2.stroke();
  }
  // 로봇 (방향 삼각형)
  const drawBot = (r, color) => {
    if (!r) return;
    cx2.save(); cx2.translate(px(r.x), py(r.y)); cx2.rotate(-r.yaw);
    cx2.fillStyle = color;
    cx2.beginPath(); cx2.moveTo(10, 0); cx2.lineTo(-6, 6);
    cx2.lineTo(-6, -6); cx2.closePath(); cx2.fill();
    cx2.restore();
  };
  drawBot(robot, '#7aa2ff');
  drawBot(robotB, '#f5b942');
  requestAnimationFrame(draw);
}
draw();

// ---- rosbridge ----
const ros = new ROSLIB.Ros({url: 'ws://localhost:9090'});
const conn = document.getElementById('conn');
ros.on('connection', () => { conn.textContent = '● rosbridge 연결됨';
                             conn.className = 'on'; });
ros.on('close', () => { conn.textContent = '연결 끊김 — 재시도 중…';
  conn.className = ''; setTimeout(() => ros.connect('ws://localhost:9090'), 2000); });

const sub = (name, type, cb, throttle) => new ROSLIB.Topic(
  {ros, name, messageType: type, throttle_rate: throttle || 0}).subscribe(cb);

sub('/model/go2/odometry', 'nav_msgs/msg/Odometry', m => {
  const q = m.pose.pose.orientation;
  robot = { x: m.pose.pose.position.x, y: m.pose.pose.position.y,
            yaw: Math.atan2(2*(q.w*q.z + q.x*q.y), 1 - 2*(q.y*q.y + q.z*q.z)) };
  if (!trail.length || Math.hypot(trail.at(-1)[0]-robot.x,
                                  trail.at(-1)[1]-robot.y) > 0.15) {
    trail.push([robot.x, robot.y]);
    if (trail.length > 800) trail.shift();
  }
}, 200);

sub('/model/go2b/odometry', 'nav_msgs/msg/Odometry', m => {
  const q = m.pose.pose.orientation;
  robotB = { x: m.pose.pose.position.x, y: m.pose.pose.position.y,
             yaw: Math.atan2(2*(q.w*q.z + q.x*q.y), 1 - 2*(q.y*q.y + q.z*q.z)) };
  if (!trailB.length || Math.hypot(trailB.at(-1)[0]-robotB.x,
                                   trailB.at(-1)[1]-robotB.y) > 0.15) {
    trailB.push([robotB.x, robotB.y]);
    if (trailB.length > 800) trailB.shift();
  }
}, 200);

sub('/gas/field', 'nav_msgs/msg/OccupancyGrid', m => {
  gasGrid = { w: m.info.width, h: m.info.height, res: m.info.resolution,
              ox: m.info.origin.position.x, oy: m.info.origin.position.y,
              data: m.data };
}, 1000);

const set = (id, t) => document.getElementById(id).textContent = t;
sub('/mission/state', 'std_msgs/msg/String', m => set('mstate', m.data), 500);
sub('/robot/battery', 'std_msgs/msg/Float32', m => {
  set('bat', m.data.toFixed(0) + ' %');
  const f = document.getElementById('batfill');
  f.style.width = m.data + '%';
  f.style.background = m.data < 20 ? 'var(--bad)'
                     : m.data < 40 ? 'var(--warn)' : 'var(--ok)';
}, 500);
sub('/inspection/gauge_value', 'std_msgs/msg/Float32', m => {
  document.getElementById('gauge').innerHTML =
    m.data.toFixed(2) + ' <small>bar</small>'; }, 300);
sub('/plant/gauge_pressure', 'std_msgs/msg/Float32', m => {
  document.getElementById('truth').innerHTML =
    m.data.toFixed(2) + ' <small>bar</small>'; }, 300);
sub('/inspection/max_temp', 'std_msgs/msg/Float32', m => {
  const el = document.getElementById('temp');
  el.innerHTML = m.data.toFixed(1) + '°C ' + (m.data > 60
    ? '<span class="badge b-bad">과열</span>'
    : '<span class="badge b-ok">정상</span>'); }, 500);
sub('/gas/concentration', 'std_msgs/msg/Float32', m => {
  document.getElementById('gasc').innerHTML =
    m.data.toFixed(1) + ' <small>ppm</small>'; }, 300);

const ev = document.getElementById('events');
const addEvent = t => {
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString('ko-KR') + '  ' + t;
  ev.prepend(li);
  while (ev.children.length > 30) ev.lastChild.remove();
};
sub('/mission/event', 'std_msgs/msg/String', m => addEvent(m.data));
sub('/gas/found', 'std_msgs/msg/Bool', m => m.data && addEvent('🚨 가스 누출원 발견'));
sub('/robot/docked', 'std_msgs/msg/Bool', m => m.data && addEvent('🔌 충전 스테이션 도킹'));
</script>
</body>
</html>
