# 사용법 (docker/ 디렉토리에서):
#   docker compose build          # 최초 1회 (10~20분)
#   docker compose up -d          # sim + novnc 기동
#   docker compose exec sim bash  # 개발 셸 진입
#   docker compose down           # 종료
#
# 확인 창구:
#   - Foxglove Studio (Mac 네이티브 앱) → ws://localhost:8765 접속
#   - Gazebo GUI가 필요할 때 → 컨테이너 안에서 bash /ws/src/plant_dt/docker/gui.sh
#     실행 후 브라우저 http://localhost:8080/vnc.html (sim 컨테이너 내장 noVNC, arm64)
services:
  sim:
    build: .
    image: plant-dt:jazzy
    container_name: plant-dt-sim
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=:1                   # gui.sh 가 띄우는 컨테이너 내부 Xvfb 화면
      - LIBGL_ALWAYS_SOFTWARE=1      # GPU 없는 컨테이너용 소프트웨어 렌더링
      - QT_X11_NO_MITSHM=1
    volumes:
      - ..:/ws/src/plant_dt          # 리포지토리 전체를 워크스페이스 소스로 마운트
    ports:
      - "8765:8765"                  # foxglove_bridge WebSocket
      - "9090:9090"                  # rosbridge (Phase 5 대시보드용)
      - "8080:8080"                  # noVNC (Gazebo GUI 브라우저 확인용)
      - "10000:10000"                # ROS-TCP-Endpoint (Unity 뷰어 연결)
    command: bash
